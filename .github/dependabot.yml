version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/project-templates/content/umbraco-headless-bff"
    schedule:
      interval: "weekly"
      day: "friday"
    # ignore prevents other major upgrades outside of Aspire
    ignore:
    - dependency-name: "*"
      update-types: ["version-update:semver-major"]
    groups:
      aspire-major-deps:
        patterns: ["Aspire*"]
        update-types: ["major"]
      dotnet-minor-patch-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
      day: "friday"
    groups:
      all-deps:
        patterns: ["*"]
